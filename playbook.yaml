- hosts: tags_items___db__
  name: Make inferstucture
  become: yes
  handlers:
    - name: Restart mariadb
      ansible.builtin.service:
        name: mariadb
        state: restarted

  tasks:
    - name: Format the persistent disk
      community.general.filesystem:
        fstype: ext4
        dev: /dev/disk/by-id/google-data-disk

    - name: Mount the persistent disk
      ansible.posix.mount:
        path: /var/lib/mysql
        src: /dev/disk/by-id/google-data-disk
        fstype: ext4
        state: mounted
        opts: defaults

    - name: Install packages
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - mariadb-server
          - python3-pymysql

    - name: Grant all PRIVILEGES to mediawiki user
      community.mysql.mysql_query:
        login_user: root
        query: "GRANT ALL PRIVILEGES ON mediawiki.* TO 'mediawiki'@'%' IDENTIFIED BY 'mediawiki';"
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Configure MariaDB to listen on all addresses
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Restart mariadb

- hosts: tags_items___web__
  name: Install Apache and PHP
  become: yes
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - apache2
          - php
          - mediawiki
          - python3-pymysql

    - name: Download Ops Agent repository script
      ansible.builtin.get_url:
        url: https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
        dest: /tmp/add-google-cloud-ops-agent-repo.sh
        mode: '0755'

    - name: Install Ops Agent
      ansible.builtin.command:
        cmd: bash /tmp/add-google-cloud-ops-agent-repo.sh --also-install

    - name: Copy the google logging config
      ansible.builtin.copy:
        src: config.yaml
        dest: /etc/google-cloud-ops-agent/config.yaml
        owner: root
        group: root
        mode: '0644'
      notify: Restart logging

  handlers:
    - name: Restart logging
      ansible.builtin.service:
        name: google-cloud-ops-agent
        state: restarted